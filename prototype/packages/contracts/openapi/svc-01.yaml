openapi: "3.1.0"
info:
  title: "Account and Driver Management"
  version: "0.1.0"
  description: "Accounts, access tokens, profiles and driver onboarding."
servers:
  - url: "http://127.0.0.1:3001"
    description: "Local service origin. Gateway routing is defined separately."
security:
  - BearerAuth: []
paths:
  "/v1/auth/register":
    post:
      operationId: "registerAccount"
      summary: "Register a rider or driver"
      security: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["email","password","displayName","role"]
              properties:
                email:
                  type: "string"
                  format: "email"
                password:
                  type: "string"
                  minLength: 8
                  maxLength: 128
                  format: "password"
                displayName:
                  type: "string"
                  minLength: 1
                  maxLength: 1000
                role:
                  type: "string"
                  enum: ["rider","driver"]
      responses:
        "201":
          description: "Resource created."
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/RequestId"
            X-Correlation-ID:
              $ref: "./common.yaml#/components/headers/CorrelationId"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["id","email","displayName","role"]
                properties:
                  id:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  email:
                    type: "string"
                    format: "email"
                  displayName:
                    type: "string"
                    minLength: 1
                    maxLength: 1000
                  role:
                    type: "string"
                    enum: ["rider","driver"]
              examples:
                sample:
                  value:
                    id: "user_1"
                    email: "rider@example.com"
                    displayName: "Sample Rider"
                    role: "rider"
        "400":
          $ref: "./common.yaml#/components/responses/BAD_REQUEST"
        "409":
          $ref: "./common.yaml#/components/responses/CONFLICT"
        "422":
          $ref: "./common.yaml#/components/responses/VALIDATION_FAILED"
        "429":
          $ref: "./common.yaml#/components/responses/RATE_LIMITED"
        "500":
          $ref: "./common.yaml#/components/responses/INTERNAL_ERROR"
  "/v1/auth/login":
    post:
      operationId: "login"
      summary: "Authenticate with credentials and OTP"
      security: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["email","password","otp"]
              properties:
                email:
                  type: "string"
                  format: "email"
                password:
                  type: "string"
                  minLength: 8
                  maxLength: 128
                  format: "password"
                otp:
                  type: "string"
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: "Successful response."
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/RequestId"
            X-Correlation-ID:
              $ref: "./common.yaml#/components/headers/CorrelationId"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["accessToken","refreshToken","expiresInSeconds"]
                properties:
                  accessToken:
                    type: "string"
                  refreshToken:
                    type: "string"
                  expiresInSeconds:
                    type: "integer"
                    minimum: 1
        "400":
          $ref: "./common.yaml#/components/responses/BAD_REQUEST"
        "401":
          $ref: "./common.yaml#/components/responses/UNAUTHENTICATED"
        "422":
          $ref: "./common.yaml#/components/responses/VALIDATION_FAILED"
        "429":
          $ref: "./common.yaml#/components/responses/RATE_LIMITED"
        "500":
          $ref: "./common.yaml#/components/responses/INTERNAL_ERROR"
  "/v1/auth/refresh":
    post:
      operationId: "refreshToken"
      summary: "Renew the access token"
      security: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["refreshToken"]
              properties:
                refreshToken:
                  type: "string"
                  minLength: 1
      responses:
        "200":
          description: "Successful response."
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/RequestId"
            X-Correlation-ID:
              $ref: "./common.yaml#/components/headers/CorrelationId"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["accessToken","refreshToken","expiresInSeconds"]
                properties:
                  accessToken:
                    type: "string"
                  refreshToken:
                    type: "string"
                  expiresInSeconds:
                    type: "integer"
                    minimum: 1
        "400":
          $ref: "./common.yaml#/components/responses/BAD_REQUEST"
        "401":
          $ref: "./common.yaml#/components/responses/UNAUTHENTICATED"
        "422":
          $ref: "./common.yaml#/components/responses/VALIDATION_FAILED"
        "429":
          $ref: "./common.yaml#/components/responses/RATE_LIMITED"
        "500":
          $ref: "./common.yaml#/components/responses/INTERNAL_ERROR"
  "/v1/users/{userId}":
    get:
      operationId: "getProfile"
      summary: "Read the caller's profile"
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: "userId"
          in: "path"
          required: true
          description: "Opaque resource identifier."
          schema:
            $ref: "./common.yaml#/components/schemas/ResourceId"
      responses:
        "200":
          description: "Successful response."
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/RequestId"
            X-Correlation-ID:
              $ref: "./common.yaml#/components/headers/CorrelationId"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["id","email","displayName","role"]
                properties:
                  id:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  email:
                    type: "string"
                    format: "email"
                  displayName:
                    type: "string"
                    minLength: 1
                    maxLength: 1000
                  role:
                    type: "string"
                    enum: ["rider","driver"]
        "400":
          $ref: "./common.yaml#/components/responses/BAD_REQUEST"
        "401":
          $ref: "./common.yaml#/components/responses/UNAUTHENTICATED"
        "403":
          $ref: "./common.yaml#/components/responses/FORBIDDEN"
        "404":
          $ref: "./common.yaml#/components/responses/NOT_FOUND"
        "429":
          $ref: "./common.yaml#/components/responses/RATE_LIMITED"
        "500":
          $ref: "./common.yaml#/components/responses/INTERNAL_ERROR"
    patch:
      operationId: "updateProfile"
      summary: "Update the caller's profile"
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: "userId"
          in: "path"
          required: true
          description: "Opaque resource identifier."
          schema:
            $ref: "./common.yaml#/components/schemas/ResourceId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["displayName"]
              properties:
                displayName:
                  type: "string"
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: "Successful response."
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/RequestId"
            X-Correlation-ID:
              $ref: "./common.yaml#/components/headers/CorrelationId"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["id","email","displayName","role"]
                properties:
                  id:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  email:
                    type: "string"
                    format: "email"
                  displayName:
                    type: "string"
                    minLength: 1
                    maxLength: 1000
                  role:
                    type: "string"
                    enum: ["rider","driver"]
        "400":
          $ref: "./common.yaml#/components/responses/BAD_REQUEST"
        "401":
          $ref: "./common.yaml#/components/responses/UNAUTHENTICATED"
        "403":
          $ref: "./common.yaml#/components/responses/FORBIDDEN"
        "404":
          $ref: "./common.yaml#/components/responses/NOT_FOUND"
        "422":
          $ref: "./common.yaml#/components/responses/VALIDATION_FAILED"
        "429":
          $ref: "./common.yaml#/components/responses/RATE_LIMITED"
        "500":
          $ref: "./common.yaml#/components/responses/INTERNAL_ERROR"
  "/v1/drivers/applications":
    post:
      operationId: "applyForOnboarding"
      summary: "Submit a driver onboarding application"
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["identityReference","licenseReference","vehicleId"]
              properties:
                identityReference:
                  $ref: "./common.yaml#/components/schemas/ResourceId"
                licenseReference:
                  $ref: "./common.yaml#/components/schemas/ResourceId"
                vehicleId:
                  $ref: "./common.yaml#/components/schemas/ResourceId"
      responses:
        "201":
          description: "Resource created."
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/RequestId"
            X-Correlation-ID:
              $ref: "./common.yaml#/components/headers/CorrelationId"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["id","driverId","status"]
                properties:
                  id:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  driverId:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  status:
                    type: "string"
                    enum: ["pending","on_hold","approved","rejected"]
        "400":
          $ref: "./common.yaml#/components/responses/BAD_REQUEST"
        "401":
          $ref: "./common.yaml#/components/responses/UNAUTHENTICATED"
        "403":
          $ref: "./common.yaml#/components/responses/FORBIDDEN"
        "409":
          $ref: "./common.yaml#/components/responses/CONFLICT"
        "422":
          $ref: "./common.yaml#/components/responses/VALIDATION_FAILED"
        "429":
          $ref: "./common.yaml#/components/responses/RATE_LIMITED"
        "500":
          $ref: "./common.yaml#/components/responses/INTERNAL_ERROR"
  "/v1/drivers/applications/{id}/documents":
    post:
      operationId: "submitDriverDocuments"
      summary: "Upload or replace onboarding documents"
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: "id"
          in: "path"
          required: true
          description: "Opaque resource identifier."
          schema:
            $ref: "./common.yaml#/components/schemas/ResourceId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["documentReferences"]
              properties:
                documentReferences:
                  type: "array"
                  items:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  minItems: 1
      responses:
        "200":
          description: "Successful response."
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/RequestId"
            X-Correlation-ID:
              $ref: "./common.yaml#/components/headers/CorrelationId"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["id","driverId","status"]
                properties:
                  id:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  driverId:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  status:
                    type: "string"
                    enum: ["pending","on_hold","approved","rejected"]
        "400":
          $ref: "./common.yaml#/components/responses/BAD_REQUEST"
        "401":
          $ref: "./common.yaml#/components/responses/UNAUTHENTICATED"
        "403":
          $ref: "./common.yaml#/components/responses/FORBIDDEN"
        "404":
          $ref: "./common.yaml#/components/responses/NOT_FOUND"
        "422":
          $ref: "./common.yaml#/components/responses/VALIDATION_FAILED"
        "429":
          $ref: "./common.yaml#/components/responses/RATE_LIMITED"
        "500":
          $ref: "./common.yaml#/components/responses/INTERNAL_ERROR"
  "/v1/drivers/applications/{id}":
    get:
      operationId: "getDriverApplication"
      summary: "Check driver application status"
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: "id"
          in: "path"
          required: true
          description: "Opaque resource identifier."
          schema:
            $ref: "./common.yaml#/components/schemas/ResourceId"
      responses:
        "200":
          description: "Successful response."
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/RequestId"
            X-Correlation-ID:
              $ref: "./common.yaml#/components/headers/CorrelationId"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["id","driverId","status"]
                properties:
                  id:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  driverId:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  status:
                    type: "string"
                    enum: ["pending","on_hold","approved","rejected"]
        "400":
          $ref: "./common.yaml#/components/responses/BAD_REQUEST"
        "401":
          $ref: "./common.yaml#/components/responses/UNAUTHENTICATED"
        "403":
          $ref: "./common.yaml#/components/responses/FORBIDDEN"
        "404":
          $ref: "./common.yaml#/components/responses/NOT_FOUND"
        "429":
          $ref: "./common.yaml#/components/responses/RATE_LIMITED"
        "500":
          $ref: "./common.yaml#/components/responses/INTERNAL_ERROR"
  "/v1/admin/drivers/applications/{id}/decision":
    put:
      operationId: "decideDriverApplication"
      summary: "Record the administrator's onboarding decision"
      x-access: "admin"
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: "id"
          in: "path"
          required: true
          description: "Opaque resource identifier."
          schema:
            $ref: "./common.yaml#/components/schemas/ResourceId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["decision"]
              properties:
                decision:
                  type: "string"
                  enum: ["approved","rejected","on_hold"]
                reason:
                  type: "string"
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: "Successful response."
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/RequestId"
            X-Correlation-ID:
              $ref: "./common.yaml#/components/headers/CorrelationId"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["id","driverId","status"]
                properties:
                  id:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  driverId:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  status:
                    type: "string"
                    enum: ["pending","on_hold","approved","rejected"]
        "400":
          $ref: "./common.yaml#/components/responses/BAD_REQUEST"
        "401":
          $ref: "./common.yaml#/components/responses/UNAUTHENTICATED"
        "403":
          $ref: "./common.yaml#/components/responses/FORBIDDEN"
        "404":
          $ref: "./common.yaml#/components/responses/NOT_FOUND"
        "409":
          $ref: "./common.yaml#/components/responses/CONFLICT"
        "422":
          $ref: "./common.yaml#/components/responses/VALIDATION_FAILED"
        "429":
          $ref: "./common.yaml#/components/responses/RATE_LIMITED"
        "500":
          $ref: "./common.yaml#/components/responses/INTERNAL_ERROR"
  "/v1/internal/drivers/{driverId}/eligibility":
    get:
      operationId: "getDriverEligibility"
      summary: "Check driver eligibility"
      description: "Requires a service JWT. Used by SVC-03 as a fallback."
      x-access: "internal"
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: "driverId"
          in: "path"
          required: true
          description: "Opaque resource identifier."
          schema:
            $ref: "./common.yaml#/components/schemas/ResourceId"
      responses:
        "200":
          description: "Successful response."
          headers:
            X-Request-ID:
              $ref: "./common.yaml#/components/headers/RequestId"
            X-Correlation-ID:
              $ref: "./common.yaml#/components/headers/CorrelationId"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["driverId","eligible"]
                properties:
                  driverId:
                    $ref: "./common.yaml#/components/schemas/ResourceId"
                  eligible:
                    type: "boolean"
        "400":
          $ref: "./common.yaml#/components/responses/BAD_REQUEST"
        "401":
          $ref: "./common.yaml#/components/responses/UNAUTHENTICATED"
        "403":
          $ref: "./common.yaml#/components/responses/FORBIDDEN"
        "404":
          $ref: "./common.yaml#/components/responses/NOT_FOUND"
        "429":
          $ref: "./common.yaml#/components/responses/RATE_LIMITED"
        "500":
          $ref: "./common.yaml#/components/responses/INTERNAL_ERROR"
components:
  securitySchemes:
    BearerAuth:
      $ref: "./common.yaml#/components/securitySchemes/BearerAuth"
